<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PRATAMA BLOGSPOT</title><style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    color: #111;
}

/* HEADER */
header {
    background: #fff;
    border-bottom: 1px solid #ddd;
    padding: 18px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.header-inner {
    max-width: 900px;
    margin: auto;
}

.logo {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

/* CONTAINER */
.container {
    max-width: 900px;
    margin: 25px auto;
    padding: 0 15px;
}

/* BLOG LIST */
#blogList {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.blog-card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
}

.blog-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.thumbnail {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
    background: #ddd;
}

.card-content {
    padding: 15px;
}

.card-title {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.3;
}

/* LOADING */
.loading {
    text-align: center;
    padding: 40px 10px;
    color: #777;
}

.error {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 25px;
    text-align: center;
    color: #777;
}

/* DETAIL */
#detailPage {
    display: none;
}

.back-button {
    display: inline-block;
    border: 0;
    background: #111;
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    margin-bottom: 18px;
}

.article {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
}

.article-body {
    padding: 20px;
}

.article-title {
    font-size: 30px;
    line-height: 1.2;
    margin-bottom: 20px;
}

.article-thumbnail {
    width: 100%;
    display: block;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    background: #ddd;
}

.article-text {
    margin-top: 22px;
    font-size: 17px;
    line-height: 1.75;
    white-space: pre-wrap;
    overflow-wrap: break-word;
}

/* MOBILE */
@media (max-width: 600px) {
    header {
        padding: 15px;
    }

    .container {
        margin-top: 18px;
    }

    .card-title {
        font-size: 17px;
    }

    .article-title {
        font-size: 25px;
    }

    .article-body {
        padding: 16px;
    }

    .article-text {
        font-size: 16px;
    }
}
</style></head><body><header>
    <div class="header-inner">
        <div class="logo">PRATAMA BLOGSPOT</div>
    </div>
</header><main class="container"><!-- HALAMAN LIST -->
<section id="homePage">

    <div id="blogList">
        <div class="loading">
            Memuat blog...
        </div>
    </div>

</section>


<!-- HALAMAN DETAIL -->
<section id="detailPage">

    <button class="back-button" onclick="showHome()">
        ← Kembali
    </button>

    <article class="article">

        <img
            id="detailThumbnail"
            class="article-thumbnail"
            src=""
            alt=""
        >

        <div class="article-body">

            <h1
                id="detailTitle"
                class="article-title">
            </h1>

            <div
                id="detailText"
                class="article-text">
            </div>

        </div>

    </article>

</section>

</main><script>

/*
=========================================
 PRATAMA BLOGSPOT
=========================================

File:
 /index.html

Data:
 /blog/1.json
 /blog/2.json
 /blog/3.json
 dst.

JSON:

{
    "title": "Judul blog",
    "thumbnail": "URL YouTube",
    "text": "Isi blog"
}

=========================================
*/


const blogList = document.getElementById("blogList");

const homePage = document.getElementById("homePage");
const detailPage = document.getElementById("detailPage");

const detailTitle = document.getElementById("detailTitle");
const detailThumbnail = document.getElementById("detailThumbnail");
const detailText = document.getElementById("detailText");


// =========================================
// YOUTUBE THUMBNAIL
// =========================================

function youtubeThumbnail(url) {

    if (!url) return "";

    /*
    Format:
    https://www.youtube.com/watch?v=VIDEO_ID
    https://youtu.be/VIDEO_ID
    https://www.youtube.com/shorts/VIDEO_ID
    */

    let videoId = null;

    try {

        const parsed = new URL(url);

        // youtube.com/watch?v=
        if (parsed.hostname.includes("youtube.com")) {

            videoId = parsed.searchParams.get("v");

            // /shorts/VIDEO_ID
            if (!videoId && parsed.pathname.includes("/shorts/")) {
                videoId = parsed.pathname.split("/shorts/")[1].split("/")[0];
            }

            // /embed/VIDEO_ID
            if (!videoId && parsed.pathname.includes("/embed/")) {
                videoId = parsed.pathname.split("/embed/")[1].split("/")[0];
            }
        }

        // youtu.be/VIDEO_ID
        if (parsed.hostname === "youtu.be") {
            videoId = parsed.pathname.substring(1).split("/")[0];
        }

    } catch (e) {
        return url;
    }

    if (videoId) {
        return "https://i.ytimg.com/vi/" + videoId + "/hqdefault.jpg";
    }

    return url;
}


// =========================================
// LOAD BLOG
// =========================================

async function loadBlogs() {

    blogList.innerHTML = `
        <div class="loading">
            Memuat blog...
        </div>
    `;

    const blogs = [];

    let number = 1;

    /*
    Terus mencari:

    1.json
    2.json
    3.json
    ...

    Kalau file tidak ditemukan,
    pencarian dihentikan.
    */

    while (true) {

        try {

            const response = await fetch(
                "/blog/" + number + ".json",
                {
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                break;
            }

            const data = await response.json();

            blogs.push({
                number: number,
                title: data.title || "Tanpa Judul",
                thumbnail: data.thumbnail || "",
                text: data.text || ""
            });

            number++;

        } catch (error) {

            break;

        }

    }


    // Tidak ada blog
    if (blogs.length === 0) {

        blogList.innerHTML = `
            <div class="error">
                Belum ada blog.
            </div>
        `;

        return;
    }


    /*
    Nomor terbesar ditaruh paling atas.

    Contoh:

    1
    2
    3

    menjadi:

    3
    2
    1
    */

    blogs.reverse();


    blogList.innerHTML = "";


    // =====================================
    // BUAT CARD
    // =====================================

    blogs.forEach(blog => {

        const card = document.createElement("div");

        card.className = "blog-card";

        const thumbnail = youtubeThumbnail(
            blog.thumbnail
        );

        card.innerHTML = `
            <img
                class="thumbnail"
                src="${escapeHTML(thumbnail)}"
                alt=""
                loading="lazy"
                onerror="this.style.display='none'"
            >

            <div class="card-content">

                <div class="card-title">
                    ${escapeHTML(blog.title)}
                </div>

            </div>
        `;


        card.onclick = function() {

            openBlog(blog);

        };


        blogList.appendChild(card);

    });

}


// =========================================
// OPEN BLOG
// =========================================

function openBlog(blog) {

    homePage.style.display = "none";

    detailPage.style.display = "block";

    detailTitle.textContent = blog.title;

    detailText.textContent = blog.text;


    const thumbnail = youtubeThumbnail(
        blog.thumbnail
    );

    detailThumbnail.src = thumbnail;

    detailThumbnail.style.display = thumbnail
        ? "block"
        : "none";


    // URL menjadi:
    // /?blog=3

    history.pushState(
        {},
        "",
        "?blog=" + blog.number
    );

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// =========================================
// KEMBALI
// =========================================

function showHome() {

    detailPage.style.display = "none";

    homePage.style.display = "block";

    history.pushState(
        {},
        "",
        window.location.pathname
    );

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// =========================================
// ESCAPE HTML
// =========================================

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


// =========================================
// BUKA BLOG DARI URL
// =========================================

async function openFromURL() {

    const params = new URLSearchParams(
        window.location.search
    );

    const blogNumber = params.get("blog");

    if (!blogNumber) {

        await loadBlogs();

        return;

    }


    if (!/^\d+$/.test(blogNumber)) {

        await loadBlogs();

        return;

    }


    try {

        const response = await fetch(
            "/blog/" + blogNumber + ".json",
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {

            await loadBlogs();

            return;

        }

        const data = await response.json();

        const blog = {

            number: Number(blogNumber),

            title: data.title || "Tanpa Judul",

            thumbnail: data.thumbnail || "",

            text: data.text || ""

        };


        openBlog(blog);


    } catch (error) {

        await loadBlogs();

    }

}


// =========================================
// BROWSER BACK/FORWARD
// =========================================

window.addEventListener(
    "popstate",
    function() {

        const params = new URLSearchParams(
            window.location.search
        );

        const blogNumber = params.get("blog");


        if (blogNumber) {

            fetch(
                "/blog/" + blogNumber + ".json",
                {
                    cache: "no-store"
                }
            )
            .then(response => response.json())
            .then(data => {

                openBlog({

                    number: Number(blogNumber),

                    title: data.title || "Tanpa Judul",

                    thumbnail: data.thumbnail || "",

                    text: data.text || ""

                });

            })
            .catch(() => {

                showHome();

            });

        } else {

            detailPage.style.display = "none";

            homePage.style.display = "block";

            loadBlogs();

        }

    }
);


// START

openFromURL();

</script></body>
</html>
