
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seratus Persen Terbaik</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0a0a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
    }

    h1 {
      font-size: clamp(28px, 7vw, 48px);
      font-weight: 800;
      margin-bottom: 18px;
      letter-spacing: -1px;
    }

    .red {
      color: #ff3030;
    }

    .subtitle {
      color: #999999;
      font-size: 16px;
      margin-bottom: 28px;
    }

    .youtube-btn {
      display: inline-block;
      padding: 14px 26px;
      background: #ff0000;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      transition: 0.2s;
    }

    .youtube-btn:hover {
      background: #cc0000;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 35px;
      font-size: 12px;
      color: #555555;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>
      <span class="red">Se</span>ratus
      <span class="red">Pe</span>rsen
      <span class="red">Te</span>rbaik
    </h1>

    <p class="subtitle">Website dalam pembangunan...</p>

    <a
      class="youtube-btn"
      href="https://youtube.com/@mrseratuspersen"
      target="_blank"
      rel="noopener noreferrer"
    >
      ▶ Subscribe YouTube
    </a>

    <footer>
      © 2026 Seratus Persen Terbaik
    </footer>
  </main>
</body>
</html>
