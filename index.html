<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRATAMA BLOGSPOT</title><style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f3f3;
    color: #111;
}

header {
    background: #fff;
    border-bottom: 1px solid #ddd;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header {
    max-width: 900px;
    margin: auto;
    padding: 18px 16px;
}

.logo {
    font-size: 22px;
    font-weight: 800;
}

.container {
    max-width: 900px;
    margin: 22px auto;
    padding: 0 15px;
}

#blogList {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: .15s;
}

.card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,.08);
}

.thumb {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    display: block;
    background: #ddd;
}

.card-body {
    padding: 15px;
}

.card-title {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.4;
}

.loading,
.empty {
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 25px;
    text-align: center;
    color: #666;
}

#detailPage {
    display: none;
}

.back {
    border: 0;
    background: #111;
    color: white;
    padding: 10px 16px;
    border-radius: 9px;
    cursor: pointer;
    margin-bottom: 15px;
}

.article {
    background: white;
    border: 1px solid #ddd;
    border-radius: 14px;
    overflow: hidden;
}

.article-image {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    display: block;
}

.article-body {
    padding: 20px;
}

.article-title {
    font-size: 30px;
    line-height: 1.25;
    margin-bottom: 20px;
}

.article-text {
    font-size: 17px;
    line-height: 1.8;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

@media(max-width:600px) {

    .article-title {
        font-size: 25px;
    }

    .article-body {
        padding: 16px;
    }

    .article-text {
        font-size: 16px;
    }

}
</style></head><body><header>
    <div class="header">
        <div class="logo">PRATAMA BLOGSPOT</div>
    </div>
</header><div class="container"><section id="homePage">

    <div id="blogList">

        <div class="loading">
            Memuat blog...
        </div>

    </div>

</section>


<section id="detailPage">

    <button class="back" onclick="goHome()">
        ← Kembali
    </button>

    <article class="article">

        <img
            id="detailImage"
            class="article-image"
            alt=""
        >

        <div class="article-body">

            <h1
                id="detailTitle"
                class="article-title">
            </h1>

            <div
                id="detailText"
                class="article-text">
            </div>

        </div>

    </article>

</section>

</div><script>

const MAX_BLOG = 1000;

const blogList =
    document.getElementById("blogList");

const homePage =
    document.getElementById("homePage");

const detailPage =
    document.getElementById("detailPage");

const detailTitle =
    document.getElementById("detailTitle");

const detailImage =
    document.getElementById("detailImage");

const detailText =
    document.getElementById("detailText");


/*
==================================================
  PENTING

  Menggunakan lokasi index.html sebagai dasar.

  Kalau:

  https://domain.com/index.html

  maka:

  https://domain.com/blog/1.json

  Kalau:

  https://domain.com/test/index.html

  maka:

  https://domain.com/test/blog/1.json
==================================================
*/

const BASE_URL =
    new URL("./", window.location.href);


/*
==================================================
 YOUTUBE THUMBNAIL
==================================================
*/

function youtubeThumbnail(url) {

    if (!url) return "";

    try {

        const u = new URL(url);

        let id = "";

        if (
            u.hostname === "youtu.be" ||
            u.hostname === "www.youtu.be"
        ) {

            id =
                u.pathname
                .substring(1)
                .split("/")[0];

        }

        else if (
            u.hostname.includes("youtube.com")
        ) {

            id =
                u.searchParams.get("v") || "";

            if (
                !id &&
                u.pathname.includes("/shorts/")
            ) {

                id =
                    u.pathname
                    .split("/shorts/")[1]
                    .split("/")[0];

            }

            if (
                !id &&
                u.pathname.includes("/embed/")
            ) {

                id =
                    u.pathname
                    .split("/embed/")[1]
                    .split("/")[0];

            }

        }

        if (id) {

            return (
                "https://i.ytimg.com/vi/" +
                id +
                "/hqdefault.jpg"
            );

        }

    } catch(e) {

        console.log("Thumbnail error:", e);

    }

    return url;
}


/*
==================================================
 LOAD JSON
==================================================
*/

async function loadBlog(number) {

    const url =
        new URL(
            "./blog/" + number + ".json",
            BASE_URL
        ).href;

    console.log(
        "Mencoba load:",
        url
    );


    try {

        const response =
            await fetch(
                url + "?v=" + Date.now(),
                {
                    cache: "no-store"
                }
            );


        console.log(
            number + ".json status:",
            response.status
        );


        if (!response.ok) {

            return null;

        }


        const text =
            await response.text();


        console.log(
            number + ".json:",
            text
        );


        const data =
            JSON.parse(text);


        return {

            number: number,

            title:
                data.title || "Tanpa Judul",

            thumbnail:
                data.thumbnail || "",

            text:
                data.text || ""

        };


    } catch(error) {

        console.error(
            "Gagal load " +
            number +
            ".json:",
            error
        );

        return null;

    }

}


/*
==================================================
 LOAD SEMUA BLOG
==================================================
*/

async function loadBlogs() {

    blogList.innerHTML = `
        <div class="loading">
            Memuat blog...
        </div>
    `;


    const blogs = [];


    /*
    Cek 1 sampai 1000.

    Tidak berhenti kalau nomor tertentu
    tidak ada.
    */

    for (
        let i = 1;
        i <= MAX_BLOG;
        i++
    ) {

        const blog =
            await loadBlog(i);


        if (blog) {

            blogs.push(blog);

        }

    }


    /*
    TERBESAR DI ATAS
    */

    blogs.sort(
        (a, b) =>
            b.number - a.number
    );


    if (blogs.length === 0) {

        blogList.innerHTML = `

            <div class="empty">

                <b>Tidak ada blog ditemukan.</b>

                <br><br>

                Pastikan struktur:

                <br><br>

                <b>index.html</b>
                <br>
                <b>blog/1.json</b>

            </div>

        `;

        return;

    }


    blogList.innerHTML = "";


    for (const blog of blogs) {

        const card =
            document.createElement("div");


        card.className =
            "card";


        const image =
            youtubeThumbnail(
                blog.thumbnail
            );


        card.innerHTML = `

            ${
                image
                ?
                `
                <img
                    class="thumb"
                    src="${escapeHTML(image)}"
                    alt=""
                    loading="lazy"
                >
                `
                :
                ""
            }

            <div class="card-body">

                <div class="card-title">
                    ${escapeHTML(blog.title)}
                </div>

            </div>

        `;


        card.onclick =
            () => openBlog(blog);


        blogList.appendChild(card);

    }

}


/*
==================================================
 DETAIL BLOG
==================================================
*/

function openBlog(blog) {

    homePage.style.display =
        "none";

    detailPage.style.display =
        "block";


    detailTitle.textContent =
        blog.title;


    detailText.textContent =
        blog.text;


    const image =
        youtubeThumbnail(
            blog.thumbnail
        );


    if (image) {

        detailImage.src =
            image;

        detailImage.style.display =
            "block";

    } else {

        detailImage.style.display =
            "none";

    }


    history.pushState(
        {},
        "",
        "?blog=" + blog.number
    );


    window.scrollTo(
        0,
        0
    );

}


/*
==================================================
 KEMBALI
==================================================
*/

function goHome() {

    detailPage.style.display =
        "none";

    homePage.style.display =
        "block";


    history.pushState(
        {},
        "",
        window.location.pathname
    );


    window.scrollTo(
        0,
        0
    );

}


/*
==================================================
 ESCAPE
==================================================
*/

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        String(value);

    return div.innerHTML;

}


/*
==================================================
 BUKA DARI URL
==================================================
*/

async function start() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const number =
        params.get("blog");


    if (number) {

        const blog =
            await loadBlog(
                Number(number)
            );


        if (blog) {

            openBlog(blog);

            return;

        }

    }


    await loadBlogs();

}


start();

</script></body>
    </html>
